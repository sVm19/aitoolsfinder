name: Build, Push to Docker Hub & Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Build and push Backend Image
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aitoolsfinder-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/aitoolsfinder-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build and push Frontend Image
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            NEXT_PUBLIC_APP_URL=https://aitoolsfinder.cloud
            NEXT_PUBLIC_API_BASE_URL=https://aitoolsfinder.cloud/api/v1
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aitoolsfinder-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/aitoolsfinder-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build and push Nginx Image
      - name: Build & Push Nginx
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/nginx
          file: ./deploy/nginx/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aitoolsfinder-nginx:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/aitoolsfinder-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Pull & Restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Deploying latest Docker images on EC2..."
            cd /home/ubuntu
            
            # Pull new images from Docker Hub
            docker compose pull
            
            # Restart containers with zero downtime
            docker compose up -d --remove-orphans
            
            # Prune dangling/old images to preserve disk space
            docker image prune -af --filter "until=48h"
            
            echo "Deployment successfully finished!"
            docker compose ps
